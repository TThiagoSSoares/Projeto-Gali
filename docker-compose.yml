services:
  db:
    image: postgres:16-alpine
    container_name: sorocaba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sorocaba
      POSTGRES_PASSWORD: sorocaba
      POSTGRES_DB: sorocaba_logistics
    ports:
      - "5432:5432"
    volumes:
      - sorocaba_pg_data:/var/lib/postgresql/data
      # Os scripts em /docker-entrypoint-initdb.d rodam SOMENTE na primeira
      # inicialização do volume (banco vazio).
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorocaba -d sorocaba_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sorocaba-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://sorocaba:sorocaba@db:5432/sorocaba_logistics
      JWT_SECRET: troque-essa-chave-em-producao-min-32-chars-mesmo
      JWT_EXPIRATION: 24h
      SOROCABA_LAT: "-23.5015"
      SOROCABA_LON: "-47.4526"
      FRONTEND_URL: http://localhost:8080
      ALERT_PRECIPITACAO_MM: "20"
      ALERT_CAPACIDADE_PCT: "80"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No compose, o frontend conversa com o backend pelo proxy do nginx
        # em "/api" - sem precisar de URL absoluta
        VITE_API_URL: /api
    container_name: sorocaba-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sorocaba_pg_data:
